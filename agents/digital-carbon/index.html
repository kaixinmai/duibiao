<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>双碳智能体</title>
  <link rel="stylesheet" href="../../carbon-target-agent.css" />
  <link rel="stylesheet" href="../../benchmark-agent.css" />
  <script src="./scene-profile.js"></script>
  <script src="../../config.js"></script>
  <script src="../../agent-icon.js"></script>
  <link rel="stylesheet" href="../../white-green-ui-kit/css/theme-green.css" id="gc-theme-green" />
  <link rel="stylesheet" href="../../white-green-ui-kit/css/theme-green-overrides.css" />
  <link rel="stylesheet" href="../../white-green-ui-kit/css/cta-shell-green.css" />
  <link rel="stylesheet" href="./dual-carbon-hub.css" />
  <link rel="stylesheet" href="./scene-kernel.css" />
  <style>
    .demo-scene-back {
      display: inline-flex;
      align-items: center;
      margin: 0 0 8px;
      padding: 0;
      border: none;
      background: transparent;
      color: #667085;
      font-size: 12px;
      font-weight: 600;
      line-height: 1.2;
      text-decoration: none;
      box-shadow: none;
    }
    .demo-scene-back:hover { color: #00b86b; background: transparent; }
  </style>
</head>
<body>
  <div class="cta-shell">
    <header class="cta-header">
      <div class="cta-header__spacer"></div>
      <button type="button" class="cta-history-toggle" id="cta-history-toggle" aria-label="展开历史会话">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </header>
    <div class="cta-body">
      <div class="cta-history-backdrop" id="cta-history-backdrop"></div>
      <aside class="cta-history" id="cta-history">
        <div class="cta-history__brand">
          <a class="demo-scene-back" id="demo-scene-back" href="../../index.html">← 返回</a>
          <div class="cta-history__brand-title">智能体</div>
          <p class="cta-history__brand-desc">场景专属智能体对话</p>
        </div>
        <button type="button" class="cta-history__new" id="cta-new-chat">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          新建会话
        </button>
        <div class="cta-history__label">历史会话</div>
        <ul class="cta-history__list" id="cta-history-list"></ul>
      </aside>
      <main class="cta-main">
        <div class="cta-main__scroll" id="cta-scroll">
          <div class="benchmark-slot-tags cta-slot-tags-bar" id="benchmarkSlotTags" hidden></div>
          <div class="benchmark-save-status" id="benchmarkSaveStatus" hidden></div>
          <div class="cta-welcome" id="cta-welcome">
            <img class="cta-welcome__avatar" id="cta-welcome-avatar" src="../../assets/agent-jiajia.png" alt="智能体" />
            <h1 class="cta-welcome__greeting" id="cta-greeting">您好，</h1>
            <p class="cta-welcome__line">我是 <span class="cta-welcome__accent">智能体</span></p>
            <p class="cta-welcome__desc">场景专属智能体对话</p>
            <section class="cta-welcome__section cta-welcome__section--ask" aria-label="常见问法">
              <div class="cta-welcome__section-head">
                <h2 class="cta-welcome__section-title">常见问法</h2>
                <p class="cta-welcome__section-hint">点击即可提问</p>
              </div>
              <div class="cta-welcome__suggestions" id="cta-welcome-suggestions"></div>
            </section>
          </div>
          <div class="cta-messages hidden" id="cta-messages"></div>
        </div>
        <div class="cta-input-bar">
          <div class="agent-copilot-input shell-input" data-shell-ui="input">
            <textarea id="cta-input" rows="3" placeholder="请输入问题" aria-label="输入问题"></textarea>
            <div id="cta-voice-status" class="voice-recorder-status hidden" aria-live="polite"></div>
            <div class="agent-copilot-input__toolbar">
              <div class="agent-copilot-input__tools">
                <button type="button" class="agent-copilot-input__tool-btn agent-copilot-input__icon-btn" title="上传附件" aria-label="上传附件" tabindex="-1">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
                </button>
                <button type="button" class="agent-copilot-input__tool-btn" title="联网搜索" tabindex="-1">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
                  <span>联网搜索</span>
                </button>
                <div class="cta-mode-wrap">
                  <button type="button" class="agent-copilot-input__tool-btn" id="cta-mode-btn" tabindex="-1">
                    <span id="cta-mode-label">直接回答</span>
                  </button>
                  <div class="agent-copilot-input__dropdown hidden" id="cta-mode-dropdown" role="listbox" aria-label="回答模式">
                    <button type="button" class="agent-copilot-input__dropdown-item agent-copilot-input__dropdown-item--active" data-mode="direct" role="option">直接回答</button>
                    <button type="button" class="agent-copilot-input__dropdown-item" data-mode="think" role="option">深度思考</button>
                  </div>
                </div>
              </div>
              <div class="agent-copilot-input__actions">
                <button type="button" class="agent-copilot-input__tool-btn agent-copilot-input__icon-btn voice-recorder-btn" id="cta-voice-btn" title="语音输入" aria-label="语音输入" tabindex="-1">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                </button>
                <button type="button" class="agent-copilot-input__send agent-copilot-input__send--disabled" id="cta-send" disabled aria-label="发送">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
                </button>
              </div>
            </div>
          </div>
          <p class="cta-input-tip">AI 生成内容仅供参考，请结合实际数据审慎决策</p>
        </div>
      </main>
    </div>
  </div>
  <script src="../../vendor/echarts.min.js"></script>
  <script src="../../js/benchmark-confidence.js"></script>
  <script src="../../js/benchmark/benchmark-config.js"></script>
  <script src="../../js/benchmark/benchmark-brand.js"></script>
  <script src="../../js/benchmark/henan-steel-data.js"></script>
  <script src="./jinshenglan-data.js?v=5"></script>
  <script src="./data-source-kernel.js?v=5"></script>
  <script src="../../js/benchmark/benchmark-data-service.js"></script>
  <script src="../../js/benchmark/benchmark-slot-filling.js"></script>
  <script src="../../js/benchmark/benchmark-chart.js"></script>
  <script src="../../js/benchmark/benchmark-result-card.js"></script>
  <script src="../../js/benchmark/benchmark-intent.js"></script>
  <script src="../../js/benchmark/benchmark-report-share.js"></script>
  <script src="../../js/benchmark/benchmark-report.js"></script>
  <script src="../../js/benchmark/benchmark-auth.js"></script>
  <script src="../../js/demo-scene-apply.js?v=2"></script>
  <script src="../../js/benchmark-cta-bridge.js"></script>
  <script src="../../data-benchmark-agent.js?v=5"></script>
  <script src="./scene-kernel-bridge.js?v=5"></script>
  <script src="./dual-carbon-hub.js"></script>
</body>
</html>
