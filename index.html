<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>对标智能体</title>
  <link rel="stylesheet" href="./portal.css" />
</head>
<body>
  <main class="portal">
    <p class="portal__brand">对标智能体</p>
    <h1 class="portal__title">请选择演示场景</h1>
    <p class="portal__desc">面向客户与管理层的三类双碳演示入口。进入场景大屏后，点击左下角智能体形象打开该场景专属对话助手。</p>

    <div class="portal__grid">
      <a class="portal-card" href="./cockpit.html">
        <span class="portal-card__badge">场景一</span>
        <h2 class="portal-card__title">数字碳表演示场景</h2>
        <p class="portal-card__desc">进入企业级碳排放及碳资产管理驾驶舱，查看排放趋势、存证进度、碳资产与交易进展，并通过智能体进行对标问答。</p>
        <span class="portal-card__cta">进入驾驶舱 →</span>
      </a>

      <a class="portal-card" href="./ledger.html">
        <span class="portal-card__badge">场景二</span>
        <h2 class="portal-card__title">集团碳账本演示场景</h2>
        <p class="portal-card__desc">进入集团双碳智服大屏，总览区域与行业碳排放、碳市场资产与双碳资讯，同样可从智能体入口进入问答助手。</p>
        <span class="portal-card__cta">进入集团大屏 →</span>
      </a>

      <a class="portal-card portal-card--muted" href="./scene-green.html">
        <span class="portal-card__badge">场景三</span>
        <h2 class="portal-card__title">绿色低碳管理平台演示场景</h2>
        <p class="portal-card__desc">绿色低碳管理平台综合演示入口。当前为占位页，后续可对接正式平台地址。</p>
        <span class="portal-card__cta">查看说明 →</span>
      </a>
    </div>
  </main>
</body>
</html>
